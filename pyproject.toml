[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ngmbench"
version = "0.1.0"
description = "Experiment harness for navigable-graph construction by merge (NGM/IGTM/CGTM) vs NN-Descent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "scikit-learn>=1.3", "pandas>=2.0",
    "pynndescent>=0.5", "tqdm>=4.65", "matplotlib>=3.7",
]

[project.optional-dependencies]
playground = ["streamlit>=1.30", "altair>=5.0"]

[tool.setuptools.packages.find]
include = ["ngmbench*"]
